---
# Default pre-commit configuration for NetBox Labs plugins.
# Generated from netbox-plugin-scaffold.
# Tool-level config lives in pyproject.toml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
        files: \.(yaml|yml)$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: ["--django"]
        exclude: '(^|/)tests/(?:.+/)?(base|plugin_testing)\.py$'
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.32.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.1"]

  - repo: https://github.com/djlint/djLint
    rev: v1.45.2
    hooks:
      - id: djlint-django
      - id: djlint-reformat-django

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: \.(yaml|yml)$

  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.51"
    hooks:
      - id: check-manifest
        stages: [manual]

  - repo: local
    hooks:
      - id: check-cloud-compat
        name: cloud-compat
        entry: python3 scripts/check_cloud_compat.py
        language: system
        files: ^netbox_scripts/.*\.py$
        pass_filenames: false
