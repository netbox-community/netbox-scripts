---
# .github/workflows/docs.yml
#
# Builds the documentation with zensical and deploys it to GitHub
# Pages. A pull request runs the same build without deploying, so a
# broken page is caught before it reaches main.
#
# Required setup (one time): Settings, Pages, Source set to
# 'GitHub Actions'. Until that is set the deploy job fails, and the
# build job still reports whether the docs are valid.

name: Docs

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    if: github.repository == 'netbox-community/netbox-scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'

      - name: Build docs
        run: zensical build --clean --strict

      - name: Upload Pages artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # yamllint disable-line rule:line-length
        with:
          path: site

  deploy:
    name: Deploy docs
    needs: build
    # A pull request validates the build only, and a manual run off a
    # side branch must not publish it.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
