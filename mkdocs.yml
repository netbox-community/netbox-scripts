site_name: "NetBox Scripts"
site_description: "Custom Scripts for NetBox"
site_url: https://netbox-community.github.io/netbox-scripts/
repo_url: https://github.com/netbox-community/netbox-scripts
repo_name: "netbox-community/netbox-scripts"

theme:
  name: material
  features:
    - content.code.copy
    - navigation.top
    - navigation.tracking
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.emoji
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview:
      - Introduction: index.md
      - Features and limitations: features.md
      - Release notes: releases.md
  - User guide:
      - Running scripts: user-guide/execution.md
      - Writing scripts: user-guide/authoring.md
  - Administration:
      - Installation: administration/installation.md
      - Configuration: administration/configuration.md
      - Permissions: administration/permissions.md
      - Uploading scripts: administration/uploading.md
      - Data Source projects: administration/data-sources.md
      - Event Rules: administration/event-rules.md
      - NetBox Branching: administration/branching.md
      - Migration: administration/migration.md
  - Reference:
      - Runtime and loading: reference/runtime.md
      - Models:
          - Script Project: reference/models/scriptproject.md
          - Script File: reference/models/scriptfile.md
          - Script Project Revision: reference/models/scriptprojectrevision.md
          - Script: reference/models/netboxscript.md
  - Development:
      - Contributing: development/contributing.md
      - Conventions: development/conventions.md
      - Releasing: development/releasing.md
      - NetBox Internals: development/netbox-internals.md
