---
# .github/workflows/release.yml
#
# On a published GitHub release, build sdist + wheel, validate with
# twine, and publish to PyPI through Trusted Publishing (OIDC).
#
# Required setup (one time): a Trusted Publisher registered on the PyPI
# project for this repository, workflow release.yml, environment pypi.
# That registration is the only credential, exchanged per run over OIDC.

name: Release

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    if: github.repository == 'netbox-community/netbox-scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python3 -m pip install -e '.[dev]'
      - name: Build sdist and wheel
        run: python3 -m build
      - name: Validate built artifacts
        run: python3 -m twine check dist/*
      - name: Upload build artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-packages
          path: dist/

  check-version:
    name: Check the tag against the version
    if: github.repository == 'netbox-community/netbox-scripts'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Refuse a tag that misnames the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 -m pip install --quiet packaging
          python3 - <<'PY'
          import os
          import re
          import tomllib

          from packaging.version import InvalidVersion, Version

          INIT = 'netbox_scripts/__init__.py'


          def fail(message):
              print(f'::error::{message}')
              raise SystemExit(1)


          sources = {'tag': os.environ['TAG'].removeprefix('v')}
          with open('pyproject.toml', 'rb') as fh:
              sources['pyproject.toml'] = tomllib.load(fh)['project']['version']
          found = re.search(
              r'''^__version__ = ['"]([^'"]+)['"]''', open(INIT).read(), re.M
          )
          if found is None:
              fail(f'no __version__ found in {INIT}')
          sources[INIT] = found.group(1)

          parsed = {}
          for name, raw in sources.items():
              try:
                  parsed[name] = Version(raw)
              except InvalidVersion:
                  fail(f'{name} is not a valid version: {raw}')

          print(' '.join(f'{n}={v}' for n, v in sources.items()))
          if len(set(parsed.values())) > 1:
              fail('the tag and the two version pins disagree')
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: [build, check-version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/netbox-scripts/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-packages
          path: dist/
      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # yamllint disable-line rule:line-length
