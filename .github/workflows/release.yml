---
# .github/workflows/release.yml
#
# On a published GitHub release, build sdist + wheel, validate with
# twine, and publish to PyPI through Trusted Publishing (OIDC).
#
# Required setup (one time): a Trusted Publisher registered on the PyPI
# project for this repository, workflow release.yml, environment pypi.
# That registration is the only credential, exchanged per run over OIDC.

name: Release

"on":
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python3 -m pip install -e '.[dev]'
      - name: Build sdist and wheel
        run: python3 -m build
      - name: Validate built artifacts
        run: python3 -m twine check dist/*
      - name: Upload build artifacts
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist-packages
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/netbox-scripts/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist-packages
          path: dist/
      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # yamllint disable-line rule:line-length
