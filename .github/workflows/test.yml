---
# .github/workflows/test.yml
#
# PR validation: lint (pre-commit), then three jobs gated on it, so
# expensive CI minutes are spent only on green code. The Python axis
# lists the interpreter versions this plugin supports. The NetBox axis
# covers the pinned NetBox ref plus the moving feature branch as a
# canary for the next minor, which reports without blocking
# (continue-on-error). The internals job below is the one blocking
# check on that branch: it resolves the NetBox symbols the plugin
# depends on and nothing else.
#
# Test config:
#   The plugin's testing/configuration.py, or configuration_branching.py
#   for the branching job, is loaded via NETBOX_CONFIGURATION +
#   PYTHONPATH, per the convention documented in
#   AGENTS.md Commands section. The plugin is installed editable into
#   NetBox's checkout so its source path is on sys.path.
#
# Coverage:
#   Collected on a SINGLE matrix leg (see the matrix `include`) and run as
#   separate, individually-gated steps, mirroring NetBox Community's CI:
#   coverage run --parallel -> coverage combine -> coverage report. Other
#   legs run plain `manage.py test --parallel`.

name: Test

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Check the manifest
        # Nothing else guards what the sdist carries.
        run: >-
          pre-commit run --hook-stage manual check-manifest --all-files
          --color=always

  test:
    name: >-
      py${{ matrix.python-version }} / netbox-${{ matrix.netbox-ref }}${{
      matrix.coverage && ' (coverage)' || '' }}
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 'feature' carries the next minor, so a core change reaches it before any
    # release this plugin supports. 'main' is what the next patch is cut from.
    continue-on-error: >-
      ${{ matrix.netbox-ref == 'feature' }}
    env:
      NETBOX_CONFIGURATION: configuration
      PYTHONPATH: ${{ github.workspace }}/netbox-scripts/testing
      COVERAGE_RCFILE: ${{ github.workspace }}/netbox-scripts/pyproject.toml  # yamllint disable-line rule:line-length
      # S3 support is a hard platform contract, so CI fails loudly when the
      # S3 test stack is missing instead of silently skipping that coverage.
      REQUIRE_S3_TESTS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        netbox-ref:
          - 'v4.7.0'
          - 'v4.7.1'
          - 'main'
          - 'feature'
        include:
          - coverage: false
          # One leg: line coverage does not vary by Python or core version.
          - python-version: '3.14'
            netbox-ref: 'main'
            coverage: true
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout plugin
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: netbox-scripts

      - name: Checkout NetBox
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: netbox-community/netbox
          ref: ${{ matrix.netbox-ref }}
          path: netbox

      - name: Setup Python ${{ matrix.python-version }}
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install NetBox dependencies
        working-directory: netbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugin (editable, with test extras)
        working-directory: netbox-scripts
        run: pip install -e '.[test]'

      - name: Run tests
        if: ${{ ! matrix.coverage }}
        working-directory: netbox
        run: >-
          python netbox/manage.py test
          netbox_scripts.tests --parallel

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        working-directory: netbox
        run: >-
          coverage run netbox/manage.py test
          netbox_scripts.tests --parallel

      - name: Combine coverage data
        if: ${{ matrix.coverage }}
        working-directory: netbox
        run: coverage combine

      - name: Show coverage report
        if: ${{ matrix.coverage }}
        working-directory: netbox
        run: coverage report

  # A job, not a matrix leg: an `include` whose keys match an existing
  # combination is merged into it, so it would have taken over the
  # coverage leg rather than adding one.
  test-branching:
    name: py3.14 / netbox-v4.7.0 / branching-1.2.1
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Reports without blocking, like the feature leg above.
    continue-on-error: true
    env:
      NETBOX_CONFIGURATION: configuration_branching
      PYTHONPATH: ${{ github.workspace }}/netbox-scripts/testing
      # Turns a Branching install that did not happen into a failure. Without
      # it the provisioned classes are not collected and the job passes
      # having run nothing.
      NETBOX_SCRIPTS_REQUIRE_BRANCHING: '1'
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout plugin
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: netbox-scripts

      - name: Checkout NetBox
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: netbox-community/netbox
          ref: v4.7.0
          path: netbox

      - name: Setup Python 3.14
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip

      - name: Install NetBox dependencies
        working-directory: netbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugin (editable, with test extras)
        working-directory: netbox-scripts
        run: pip install -e '.[test]'

      # Pinned exactly, so it cannot drift onto a line whose NetBox
      # ceiling sits below this plugin's floor.
      - name: Install NetBox Branching
        run: pip install 'netboxlabs-netbox-branching==1.2.1'

      # Provisioning replicates every branch-aware table, once per test.
      - name: Tune PostgreSQL for branch provisioning
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client
          PGPASSWORD=netbox psql -h localhost -U netbox \
            -c "ALTER SYSTEM SET checkpoint_timeout = '30min'" \
            -c "ALTER SYSTEM SET max_wal_size = '2GB'" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET lock_timeout = '60s'" \
            -c "SELECT pg_reload_conf()"

      # This module only, and never --parallel: each test provisions and
      # drops a schema, which parallel clones would multiply per worker.
      - name: Run the provisioned-branch tests
        working-directory: netbox
        run: >-
          python netbox/manage.py test
          netbox_scripts.tests.test_branching
          netbox_scripts.tests.test_branching_provisioned -v 2

  # Blocking, unlike the feature test leg. With no database, services or
  # fixtures, what fails here is a crossing, the plugin skipped outside its
  # version range, or NetBox settings or setup, each worth a look before a
  # merge.
  internals:
    name: netbox-feature / internals canary
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    env:
      NETBOX_CONFIGURATION: configuration
      PYTHONPATH: ${{ github.workspace }}/netbox-scripts/testing
    steps:
      - name: Checkout plugin
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: netbox-scripts

      - name: Checkout NetBox
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: netbox-community/netbox
          ref: feature
          path: netbox

      - name: Setup Python 3.12
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip

      - name: Install NetBox dependencies
        working-directory: netbox
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install plugin (editable)
        working-directory: netbox-scripts
        run: pip install -e .

      - name: Resolve every listed NetBox internal
        working-directory: netbox-scripts
        run: >-
          python scripts/check_netbox_internals.py
          --netbox ${{ github.workspace }}/netbox/netbox
